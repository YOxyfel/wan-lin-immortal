<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Demo, Beat by Beat | Wan &amp; Lin Immortal</title>
    <meta name="description" content="A cinematic, beat-by-beat walkthrough of the Wan & Lin Immortal vertical slice — from the falling scroll to the chilling discovery in the ashes.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/site.css">
    <script>
        tailwind.config = {
            theme: { extend: {
                fontFamily: { serif: ['Cinzel', 'serif'], story: ['"Cormorant Garamond"', 'serif'] },
                colors: {
                    obsidian: { 900: '#050505', 800: '#0a0a0c', 700: '#121214' },
                    imperial: { 300: '#FDE047', 400: '#EAB308', 500: '#C28E0E', 800: '#5A4310', 900: '#2E2209' },
                    jade: { 400: '#34D399', 500: '#059669', 900: '#022C22' },
                    cinnabar: { 500: '#C83232', 800: '#5C1212', 900: '#2D0606' }
                }
            } }
        }
    </script>
    <style>
        html, body { height: 100%; }
        body { overflow: hidden; }

        /* Cinematic scroll-snap stage */
        #stage {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 100vh; height: 100dvh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }
        #stage::-webkit-scrollbar { display: none; }

        /* Cross-fading background layers */
        #bg-layers { position: fixed; inset: 0; z-index: 0; background: #050505; }
        .bg-layer { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s ease; }
        .bg-layer.active { opacity: 1; }

        /* Blurred ambient fill — keeps wide/ultrawide screens from showing bare bars */
        .bg-ambient {
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
            filter: blur(48px) brightness(0.45) saturate(1.2);
            transform: scale(1.3);
        }
        .bg-ambient::after {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at center, rgba(5,5,5,0.1) 0%, rgba(5,5,5,0.55) 70%, rgba(5,5,5,0.85) 100%);
        }

        /* Crisp 1:1 artwork — locked square, centered, never wider than it is tall */
        .bg-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .bg-pic-frame {
            position: relative;
            width: min(92vh, 92vw);
            height: min(92vh, 92vw);
            transition: transform 9s ease-out;
        }
        .bg-layer.active .bg-pic-frame { transform: scale(1.05); }
        .bg-pic { width: 100%; height: 100%; object-fit: cover; display: block; box-shadow: 0 0 110px rgba(0,0,0,0.75); }

        /* Wide (16:9) beats — fill edge-to-edge with a slow drift */
        .bg-pic-wide {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; object-position: center;
            transform: scale(1.06); transition: transform 9s ease-out;
        }
        .bg-layer.bg-wide.active .bg-pic-wide { transform: scale(1.14); }
        /* Decorative scroll-frame around the square */
        .bg-pic-frame::before { content: ''; position: absolute; inset: -14px; border: 1px solid rgba(194,142,14,0.28); pointer-events: none; }
        .bg-pic-frame::after { content: ''; position: absolute; inset: 5px; border: 1px solid rgba(255,255,255,0.07); pointer-events: none; }
        .corner { position: absolute; width: 16px; height: 16px; border: 1px solid #C28E0E; z-index: 3; pointer-events: none; }
        .corner.tl { top: -14px; left: -14px; border-right: 0; border-bottom: 0; }
        .corner.tr { top: -14px; right: -14px; border-left: 0; border-bottom: 0; }
        .corner.bl { bottom: -14px; left: -14px; border-right: 0; border-top: 0; }
        .corner.br { bottom: -14px; right: -14px; border-left: 0; border-top: 0; }

        #bg-vignette {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background:
              radial-gradient(circle at center, rgba(5,5,5,0) 45%, rgba(5,5,5,0.3) 85%, rgba(5,5,5,0.6) 100%),
              linear-gradient(to bottom, rgba(5,5,5,0.4) 0%, rgba(5,5,5,0.05) 35%, rgba(5,5,5,0.35) 70%, rgba(5,5,5,0.9) 100%);
        }
        /* Soft left scrim — lighter now that the copy has its own halo, so the art stays visible */
        #bg-scrim {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: linear-gradient(100deg,
              rgba(5,5,5,0.75) 0%, rgba(5,5,5,0.45) 26%, rgba(5,5,5,0.12) 46%, rgba(5,5,5,0) 62%);
        }

        .beat {
            position: relative; z-index: 2;
            height: 100vh; height: 100dvh; width: 100%;
            scroll-snap-align: start;
            display: flex; align-items: center;
            padding: 5rem 1.25rem;
        }
        @media (min-width: 1024px) { .beat { padding-left: 5.5rem; padding-right: 9rem; } }
        .beat-inner { position: relative; max-width: 40rem; padding: 1.75rem 1.75rem 2rem; }
        @media (min-width: 640px) { .beat-inner { padding: 2.25rem 2.75rem 2.5rem; } }
        /* Solid frosted panel behind the copy so it is always legible over any art */
        .beat-inner::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background: linear-gradient(to right,
              rgba(5,5,5,0.9) 0%, rgba(5,5,5,0.86) 50%, rgba(5,5,5,0.7) 78%, rgba(5,5,5,0) 100%);
            -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
            border-left: 2px solid rgba(194,142,14,0.55);
        }
        .beat-kicker, .beat-title, .beat-body, .beat-extra {
            opacity: 0; transform: translateY(40px); transition: all 1.2s cubic-bezier(0.25,1,0.5,1);
            text-shadow: 0 1px 3px rgba(0,0,0,0.7);
        }
        .beat.in .beat-kicker { opacity: 1; transform: translateY(0); transition-delay: 0.1s; }
        .beat.in .beat-title  { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
        .beat.in .beat-body   { opacity: 1; transform: translateY(0); transition-delay: 0.55s; }
        .beat.in .beat-extra  { opacity: 1; transform: translateY(0); transition-delay: 0.8s; }

        .beat-num-glyph {
            position: absolute; left: 3vw; bottom: 7vh; z-index: -1;
            font-family: 'Cinzel', serif; font-size: 20vh; line-height: 1;
            color: rgba(255,255,255,0.045); user-select: none; pointer-events: none;
        }

        /* Side beat tracker (right edge, clear of the text) */
        #tracker { position: fixed; right: 2rem; top: 50%; transform: translateY(-50%); z-index: 30; display: none; text-align: right; }
        @media (min-width: 1024px) { #tracker { display: block; } }
        #tracker button {
            display: flex; flex-direction: row-reverse; align-items: center; justify-content: flex-end; gap: 0.9rem;
            width: 100%;
            background: none; border: none; cursor: pointer;
            padding: 0.45rem 0; color: #9ca3af;
            font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase;
            transition: color 0.5s ease;
            text-shadow: 0 1px 10px rgba(0,0,0,0.95);
        }
        #tracker .dot { width: 9px; height: 9px; border: 1px solid #5a4310; transform: rotate(45deg); transition: all 0.5s ease; }
        #tracker button.active { color: #FDE047; }
        #tracker button.active .dot { background: #C28E0E; border-color: #C28E0E; box-shadow: 0 0 12px rgba(194,142,14,0.7); }
        #tracker button:hover { color: #d1d5db; }

        /* Control bar */
        #controls {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
            display: flex; align-items: center; gap: 1.25rem;
            padding: 1rem 1.5rem; backdrop-filter: blur(8px);
            background: linear-gradient(to top, rgba(5,5,5,0.92), rgba(5,5,5,0));
        }
        #controls .ctrl-btn {
            display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
            width: 2.75rem; height: 2.75rem; border: 1px solid rgba(194,142,14,0.4);
            color: #C28E0E; cursor: pointer; transition: all 0.4s ease; background: rgba(5,5,5,0.4);
        }
        #controls .ctrl-btn:hover { color: #FDE047; border-color: #FDE047; }
        #beat-label { font-family: 'Cinzel', serif; letter-spacing: 0.2em; text-transform: uppercase; font-size: 0.7rem; color: #9ca3af; white-space: nowrap; flex: 0 0 auto; }
        #beat-label b { color: #FDE047; font-weight: 500; }
        #progress-track { flex: 1 1 auto; min-width: 2.5rem; height: 1px; background: rgba(255,255,255,0.12); position: relative; }

        /* Compact controls on small screens */
        @media (max-width: 640px) {
            #controls { gap: 0.7rem; padding: 0.85rem 1rem; }
            #controls .ctrl-btn { width: 2.5rem; height: 2.5rem; }
            #beat-label { font-size: 0.62rem; letter-spacing: 0.12em; }
            #beat-label .beat-name { display: none; }
            #scroll-hint { bottom: 4.75rem; }
        }
        #progress-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(to right, #5A4310, #C28E0E); transition: width 0.6s ease; }

        /* Scroll hint */
        #scroll-hint { position: fixed; left: 50%; bottom: 5.5rem; transform: translateX(-50%); z-index: 25; color: #9ca3af; text-align: center; transition: opacity 0.6s ease; text-shadow: 0 1px 10px rgba(0,0,0,0.9); }

        /* Top nav readability over bright art */
        nav { text-shadow: 0 2px 8px rgba(0,0,0,0.95), 0 0 22px rgba(0,0,0,0.6); }
        nav::before {
            content: ''; position: absolute; inset: 0 0 -2.75rem 0; z-index: -1; pointer-events: none;
            background: linear-gradient(to bottom, rgba(5,5,5,0.92) 0%, rgba(5,5,5,0.7) 45%, rgba(5,5,5,0.3) 78%, rgba(5,5,5,0) 100%);
        }
    </style>
</head>
<body class="bg-obsidian-900 text-gray-200 font-story antialiased selection:bg-imperial-800 selection:text-imperial-300">

    <!-- Top nav (minimal, transparent) -->
    <nav class="fixed w-full z-40 top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="font-serif text-lg md:text-xl font-light text-imperial-400 tracking-[0.3em] uppercase">Wan<span class="text-gray-500 font-thin">&amp;</span>Lin</a>
                <a href="index.html" class="text-gray-300 hover:text-imperial-300 font-serif uppercase tracking-[0.2em] text-[0.65rem] transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    Exit
                </a>
            </div>
        </div>
    </nav>

    <!-- Background layers + vignette + text scrim -->
    <div id="bg-layers"></div>
    <div id="bg-vignette"></div>
    <div id="bg-scrim"></div>

    <!-- Cinematic stage -->
    <main id="stage"></main>

    <!-- Side tracker -->
    <div id="tracker"></div>

    <!-- Scroll hint -->
    <div id="scroll-hint">
        <p class="font-serif uppercase tracking-[0.3em] text-[0.6rem] mb-2">Scroll to Witness</p>
        <svg class="w-4 h-4 mx-auto animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
    </div>

    <!-- Controls -->
    <div id="controls">
        <button id="btn-prev" class="ctrl-btn" aria-label="Previous beat" title="Previous (←)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button id="btn-play" class="ctrl-btn" aria-label="Auto-play" title="Auto-Play">
            <svg id="icon-play" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" class="w-4 h-4 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button id="btn-next" class="ctrl-btn" aria-label="Next beat" title="Next (→)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" d="M9 5l7 7-7 7"/></svg>
        </button>
        <span id="beat-label">Beat <b>01</b> / 09 <span class="beat-name">&mdash; The Incident</span></span>
        <div id="progress-track"><div id="progress-fill"></div></div>
    </div>

    <script>
    const BEATS = [
        {
            num: '一', glyph: '序', tone: 'imperial',
            kicker: 'Beat 01 — Intro Cinematic',
            title: 'The Heavens Tear Open',
            body: 'Two Immortals clash in the sky above a quiet world. Their war shatters the clouds — and from the wound in heaven, a single divine scroll spirals down, lost, falling toward a village that has never known the names of gods.',
            bg: 'Images/Art/WideIntro.png', wide: true
        },
        {
            num: '二', glyph: '村', tone: 'imperial',
            kicker: 'Beat 02 — Peaceful Exploration',
            title: 'A Village Unaware',
            body: 'You wander warm, lantern-lit streets. Merchants haggle, children laugh. You pass patrolling soldiers and a Captain&rsquo;s desk where a strange crystal pulses with quiet light. It means nothing to you now. It will mean everything soon.',
            bg: 'Images/Environment/City.png'
        },
        {
            num: '三', glyph: '劫', tone: 'cinnabar',
            kicker: 'Beat 03 — The Catastrophe',
            title: 'Ash &amp; Slaughter',
            body: 'Without warning, the monster wave breaks upon the village. Roofs collapse into fire. You run — a desperate, guided flight through burning alleys, the screams of neighbours swallowed by the roar.',
            bg: 'Images/MCs/MC2.png'
        },
        {
            num: '四', glyph: '託', tone: 'imperial',
            kicker: 'Beat 04 — The Handoff',
            title: 'Your Uncle&rsquo;s Last Breath',
            body: 'Dying in the rubble, your uncle presses the fallen scroll into your hands. He knows the truth you do not.',
            extra: '&ldquo;Grow strong&hellip; seek a great sect. The monsters were only a cover. Trust nothing.&rdquo;',
            bg: 'Images/Magic/image_0 (18).png'
        },
        {
            num: '五', glyph: '試', tone: 'imperial',
            kicker: 'Beat 05 — Survival Quests',
            title: 'To Earn the Right',
            body: 'The scroll will not open for the weak. Among the ruins you take up small, aching tasks — burying the dead, salvaging the living, surviving the rogue beasts that linger. Each trial raises your Mortal Might until, at last, the seal trembles.',
            bg: 'Images/Environment/Environment2.png'
        },
        {
            num: '六', glyph: '丹', tone: 'jade',
            kicker: 'Beat 06 — The Scroll Trial',
            title: 'Inside the Celestial Arena',
            body: 'The scroll unfurls and the world dissolves. You stand in an isolated heaven of light and sigil, face to face with the Immortal trapped within — arrogant, transactional, amused by your mortality. He sets his trial. Survive it, or remain dust forever.',
            bg: 'Images/Magic/AscendantMagic.png'
        },
        {
            num: '七', glyph: '契', tone: 'imperial',
            kicker: 'Beat 07 — The Pact &amp; Twist',
            title: 'Origin: Unknown',
            body: 'You endure. The Immortal pries open your meridians — and the heavens recoil. The system reads your origin and returns a single, impossible word.',
            extra: 'A terrifying, supposedly extinct bloodline sleeps in your veins. The Immortal&rsquo;s contempt becomes hunger. A secret pact is struck: your power, for his resurrection.',
            bg: 'Images/MCs/MC1.png'
        },
        {
            num: '八', glyph: '謀', tone: 'cinnabar',
            kicker: 'Beat 08 — The Discovery',
            title: 'The Order in the Ashes',
            body: 'Returned to the smoldering ruins, you find the Captain&rsquo;s crystal half-buried in soot. Its projection flickers to life with a command that turns your grief to ice:',
            extra: '&ldquo;Leave your post at <span class="text-cinnabar-500">jdi38edh</span>.&rdquo; &mdash; The soldiers did not flee. They were ordered to let the village die.',
            bg: 'Images/Magic/MagicSphere.png'
        },
        {
            num: '九', glyph: '終', tone: 'imperial',
            kicker: 'Beat 09 — Outro',
            title: 'Thanks for Playing',
            body: 'Your family is still missing. The executions were delayed, not cancelled. And somewhere above the clouds, those who ordered the slaughter do not yet know that the last of an extinct bloodline survived.',
            extra: 'Wan &amp; Lin Immortal — the journey has only begun.',
            bg: 'Images/Art/ArtSunset.png',
            cta: true
        }
    ];

    const toneColor = { imperial: 'text-imperial-300', jade: 'text-jade-400', cinnabar: 'text-cinnabar-500' };
    const enc = (s) => encodeURI(s);

    const stage = document.getElementById('stage');
    const bgLayers = document.getElementById('bg-layers');
    const tracker = document.getElementById('tracker');
    const beatLabel = document.getElementById('beat-label');
    const progressFill = document.getElementById('progress-fill');
    const scrollHint = document.getElementById('scroll-hint');

    // Build background layers.
    // Wide (16:9) beats fill the frame edge-to-edge; square beats are locked to a framed 1:1.
    bgLayers.innerHTML = BEATS.map((b, i) => b.wide
        ? `<div class="bg-layer bg-wide" data-i="${i}">
            <div class="bg-ambient" style="background-image:url('${enc(b.bg)}')"></div>
            <img class="bg-pic-wide" src="${enc(b.bg)}" alt="">
        </div>`
        : `<div class="bg-layer" data-i="${i}">
            <div class="bg-ambient" style="background-image:url('${enc(b.bg)}')"></div>
            <div class="bg-stage">
                <div class="bg-pic-frame">
                    <span class="corner tl"></span><span class="corner tr"></span>
                    <span class="corner bl"></span><span class="corner br"></span>
                    <img class="bg-pic" src="${enc(b.bg)}" alt="">
                </div>
            </div>
        </div>`
    ).join('');
    const layers = [...bgLayers.querySelectorAll('.bg-layer')];

    // Build beats
    stage.innerHTML = BEATS.map((b, i) => `
        <section class="beat" data-i="${i}">
            <div class="beat-num-glyph">${b.glyph}</div>
            <div class="beat-inner">
                <p class="beat-kicker font-serif uppercase tracking-[0.35em] text-[0.72rem] mb-5 ${toneColor[b.tone]}">${b.kicker}</p>
                <h2 class="beat-title font-serif text-4xl md:text-6xl text-white font-normal leading-[1.15] mb-7">${b.title}</h2>
                <p class="beat-body text-xl md:text-2xl text-gray-50 font-normal leading-relaxed">${b.body}</p>
                ${b.extra ? `<p class="beat-extra mt-6 text-lg md:text-xl text-gray-100 italic leading-relaxed border-l-2 border-imperial-400 pl-6">${b.extra}</p>` : ''}
                ${b.cta ? `<div class="beat-extra mt-10 flex flex-wrap gap-6">
                    <a href="index.html#demo" class="group relative px-8 py-3 overflow-hidden">
                        <div class="absolute inset-0 border border-imperial-500/60 group-hover:border-imperial-400 transition-colors duration-700"></div>
                        <span class="relative text-imperial-300 font-serif uppercase tracking-[0.3em] text-sm">Play the Demo</span>
                    </a>
                    <a href="gallery.html" class="text-gray-400 hover:text-white font-serif uppercase tracking-[0.2em] text-xs transition-colors self-center">View the Gallery &rarr;</a>
                </div>` : ''}
            </div>
        </section>
    `).join('');
    const beats = [...stage.querySelectorAll('.beat')];

    // Build tracker
    tracker.innerHTML = BEATS.map((b, i) =>
        `<button data-i="${i}"><span class="dot"></span><span>${b.num} &nbsp; ${b.kicker.split('—')[1].trim()}</span></button>`
    ).join('');
    const trackBtns = [...tracker.querySelectorAll('button')];

    let current = -1;
    function setActive(i) {
        if (i === current) return;
        current = i;
        layers.forEach((l, j) => l.classList.toggle('active', j === i));
        beats.forEach((b, j) => b.classList.toggle('in', j === i));
        trackBtns.forEach((t, j) => t.classList.toggle('active', j === i));
        const n = String(i + 1).padStart(2, '0');
        const total = String(BEATS.length).padStart(2, '0');
        const name = BEATS[i].kicker.split('—')[1].trim();
        beatLabel.innerHTML = `Beat <b>${n}</b> / ${total} <span class="beat-name">&mdash; ${name}</span>`;
        progressFill.style.width = ((i + 1) / BEATS.length * 100) + '%';
        scrollHint.style.opacity = i === 0 ? '1' : '0';
    }

    // Observe which beat is centered
    const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
            if (e.isIntersecting && e.intersectionRatio > 0.55) {
                setActive(parseInt(e.target.dataset.i, 10));
            }
        });
    }, { root: stage, threshold: [0.55] });
    beats.forEach((b) => io.observe(b));

    function goTo(i) {
        i = Math.max(0, Math.min(BEATS.length - 1, i));
        beats[i].scrollIntoView({ behavior: 'smooth' });
    }

    trackBtns.forEach((t) => t.addEventListener('click', () => goTo(parseInt(t.dataset.i, 10))));
    document.getElementById('btn-prev').addEventListener('click', () => { stopAuto(); goTo(current - 1); });
    document.getElementById('btn-next').addEventListener('click', () => { stopAuto(); goTo(current + 1); });

    // Auto-play
    let autoTimer = null;
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');
    function startAuto() {
        if (autoTimer) return;
        iconPlay.classList.add('hidden'); iconPause.classList.remove('hidden');
        if (current >= BEATS.length - 1) goTo(0);
        autoTimer = setInterval(() => {
            if (current >= BEATS.length - 1) { stopAuto(); return; }
            goTo(current + 1);
        }, 7500);
    }
    function stopAuto() {
        if (!autoTimer) return;
        clearInterval(autoTimer); autoTimer = null;
        iconPlay.classList.remove('hidden'); iconPause.classList.add('hidden');
    }
    document.getElementById('btn-play').addEventListener('click', () => autoTimer ? stopAuto() : startAuto());

    // Keyboard
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { stopAuto(); goTo(current + 1); }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { stopAuto(); goTo(current - 1); }
    });
    // Stop auto-play if the user scrolls manually
    let userScrollLock = false;
    stage.addEventListener('wheel', () => { if (!userScrollLock) stopAuto(); });
    stage.addEventListener('touchstart', () => stopAuto());

    setActive(0);
    </script>
</body>
</html>
